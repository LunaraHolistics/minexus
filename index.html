<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJETO M:I — Operação Nexus</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--surface:#0a0d12;--on:#e5e2e1;--onv:#c1c7cc;--gold:#C5A059;--goldl:#e9c176;--bronze:#CD7F32;--amber:#FFBF00;--petrol:#003344;--red:#ef4444;--green:#4ade80;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--surface);font-family:'Manrope',sans-serif;color:var(--on);}
.bg{position:fixed;inset:0;z-index:1;background:radial-gradient(ellipse at 50% -10%,rgba(197,160,89,.14) 0%,transparent 55%),radial-gradient(ellipse at 15% 90%,rgba(0,51,68,.4) 0%,transparent 60%),radial-gradient(ellipse at 85% 85%,rgba(0,51,68,.3) 0%,transparent 60%),linear-gradient(180deg,#0a0d12 0%,#0e1218 50%,#0a0d12 100%);}
.grid{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.06;background-image:linear-gradient(rgba(197,160,89,.4) 1px,transparent 1px),linear-gradient(90deg,rgba(197,160,89,.4) 1px,transparent 1px);background-size:56px 56px;}
.grain{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.08;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");mix-blend-mode:overlay;}
.scanlines{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:.14;background:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0,rgba(0,0,0,.3) 1px,transparent 1px,transparent 3px);}
.vignette{position:fixed;inset:0;z-index:5;pointer-events:none;box-shadow:inset 0 0 220px rgba(0,0,0,.9);}
.stage{position:relative;z-index:10;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:0;}
.badge{position:relative;width:120px;height:120px;margin-bottom:28px;animation:fade-down 1s .1s both;}
.badge .ring{position:absolute;inset:0;border:1px solid rgba(197,160,89,.5);border-radius:50%;border-top-color:var(--amber);animation:spin 6s linear infinite;box-shadow:0 0 30px rgba(197,160,89,.25);}
.badge .ring.r2{inset:10px;border-color:rgba(197,160,89,.25);border-top-color:var(--gold);animation:spin 4s linear infinite reverse;}
.badge .core{position:absolute;inset:22px;border:1px solid var(--gold);border-radius:50%;background:rgba(0,51,68,.35);display:flex;align-items:center;justify-content:center;font-family:'Libre Caslon Text',serif;font-size:26px;font-weight:700;color:var(--goldl);}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fade-down{from{opacity:0;transform:translateY(-20px);}to{opacity:1;transform:translateY(0);}}
@keyframes fade-up{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--amber);letter-spacing:.4em;text-transform:uppercase;margin-bottom:14px;animation:fade-up .8s .3s both;}
.eyebrow .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);margin:0 8px;animation:blink 1.4s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
.title{font-family:'Libre Caslon Text',serif;font-size:clamp(34px,7vw,64px);font-weight:700;color:var(--on);letter-spacing:.02em;line-height:1.05;animation:fade-up .8s .45s both;}
.title span{color:var(--goldl);text-shadow:0 0 30px rgba(233,193,118,.35);}
.sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--onv);letter-spacing:.3em;text-transform:uppercase;margin-top:10px;animation:fade-up .8s .6s both;}
.divider{width:min(420px,70%);height:1px;margin:26px 0;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:fade-up .8s .7s both;}
.tag{font-family:'Libre Caslon Text',serif;font-style:italic;font-size:clamp(14px,2.4vw,18px);color:var(--onv);max-width:560px;line-height:1.7;min-height:3.4em;animation:fade-up .8s .8s both;}
.tag .cursor{display:inline-block;width:8px;height:1em;background:var(--amber);vertical-align:-2px;margin-left:2px;animation:blink 1s infinite;}
.actions{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap;justify-content:center;animation:fade-up .8s 1s both;}
.btn{padding:16px 30px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all .3s;display:flex;align-items:center;gap:10px;text-decoration:none;border-radius:3px;}
.btn.primary{background:var(--gold);color:var(--surface);font-weight:700;box-shadow:0 0 0 rgba(197,160,89,0);}
.btn.primary:hover{background:var(--amber);transform:translateY(-3px);box-shadow:0 10px 30px rgba(255,191,0,.35);}
.btn.ghost{background:transparent;color:var(--goldl);border:1px solid rgba(197,160,89,.5);}
.btn.ghost:hover{background:rgba(197,160,89,.12);transform:translateY(-3px);}
.stats{margin-top:30px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--onv);letter-spacing:.15em;text-transform:uppercase;animation:fade-up .8s 1.15s both;}
.stats b{color:var(--amber);}
.footer{position:fixed;bottom:14px;left:0;right:0;text-align:center;font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(193,199,204,.5);letter-spacing:.25em;text-transform:uppercase;z-index:10;}
@media (max-width:600px){.badge{width:96px;height:96px;}.badge .core{inset:18px;font-size:20px;}}
</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div><div class="grain"></div><div class="scanlines"></div><div class="vignette"></div>
<main class="stage">
  <div class="badge"><div class="ring"></div><div class="ring r2"></div><div class="core">M:I</div></div>
  <div class="eyebrow"><span class="dot"></span>Transmissão Segura — Nível 5<span class="dot"></span></div>
  <h1 class="title">OPERAÇÃO <span>NEXUS</span></h1>
  <p class="sub">Divisão de Crimes Contra o Patrimônio</p>
  <div class="divider"></div>
  <p class="tag"><span id="typed"></span><span class="cursor"></span></p>
  <div class="actions">
    <a class="btn primary" href="telas-individuais/01-login.html"><i class="fas fa-folder-open"></i> Iniciar Missão</a>
    <a class="btn ghost" href="telas-individuais/07-museu.html"><i class="fas fa-trophy"></i> Sala de Troféus</a>
  </div>
  <div class="stats" id="stats"></div>
</main>
<div class="footer">Classificado // Propriedade da Agência // <span id="year"></span></div>
<script>
(function(){
  document.getElementById('year').textContent=new Date().getFullYear();
  // Efeito máquina de escrever
  var msg='Artefatos sumiram. Suspeitos cruzam fronteiras. Você é a última linha de defesa.';
  var el=document.getElementById('typed'),i=0;
  (function type(){ if(i<=msg.length){ el.textContent=msg.slice(0,i); i++; setTimeout(type, 34); } })();
  // Status do agente (se já existir progresso neste navegador)
  try{
    var col=JSON.parse(localStorage.getItem('minexus_museum_collection')||'[]');
    var ag=JSON.parse(localStorage.getItem('minexus_agent')||'null');
    var lvl=localStorage.getItem('minexus_agent_level')||'1';
    var s=document.getElementById('stats');
    if(ag){ s.innerHTML='Agente <b>'+ag.codename+'</b> • Nível <b>'+lvl+'</b> • Artefatos recuperados: <b>'+col.length+'</b>'; }
    else{ s.innerHTML='Nenhum agente em campo • <b>'+col.length+'</b> artefatos no acervo'; }
  }catch(e){}
})();
</script>
</body>
</html>
