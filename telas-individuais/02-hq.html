<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HQ — PROJETO M:I</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--surface:#0a0d12;--on:#e5e2e1;--onv:#c1c7cc;--gold:#C5A059;--goldl:#e9c176;--bronze:#CD7F32;--amber:#FFBF00;--petrol:#003344;--ivory:#F5F5DC;--red:#ef4444;--green:#4ade80;--level-up:#ffd700;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--surface);font-family:'Manrope',sans-serif;color:var(--on);}
.hq-bg{position:fixed;inset:0;z-index:1;background:radial-gradient(ellipse at 50% 0%,rgba(197,160,89,.12) 0%,transparent 55%),radial-gradient(ellipse at 20% 90%,rgba(0,51,68,.35) 0%,transparent 60%),linear-gradient(180deg,#0a0d12 0%,#10141a 50%,#0a0d12 100%);}
.grid-overlay{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.07;background-image:linear-gradient(rgba(197,160,89,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(197,160,89,.3) 1px,transparent 1px);background-size:48px 48px;}
.film-grain{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");mix-blend-mode:overlay;}
.scanlines{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:.12;background:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0,rgba(0,0,0,.3) 1px,transparent 1px,transparent 3px);}
.vignette{position:fixed;inset:0;z-index:5;pointer-events:none;box-shadow:inset 0 0 200px rgba(0,0,0,.85);}
.ui{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;pointer-events:none;}
.ui>*{pointer-events:auto;}
.hq-header{padding:24px 32px 12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;}
.hq-brand{display:flex;align-items:center;gap:16px;}
.hq-logo{width:52px;height:52px;border:1px solid var(--gold);background:rgba(197,160,89,.08);display:flex;align-items:center;justify-content:center;font-family:'Libre Caslon Text',serif;font-size:20px;font-weight:700;color:var(--gold);}
.hq-title{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:var(--goldl);}
.hq-sub{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--onv);letter-spacing:.12em;margin-top:2px;}
.agent-chip{display:flex;align-items:center;gap:10px;padding:8px 16px;border:.5px solid var(--gold);background:rgba(0,51,68,.3);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);}
.agent-chip b{color:var(--amber);}
.agent-chip .lvl{color:var(--level-up);border-left:1px solid rgba(197,160,89,.3);padding-left:10px;}
.hq-main{flex:1;overflow-y:auto;padding:20px 32px;}
.section-title{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--gold);letter-spacing:.25em;text-transform:uppercase;margin:16px 0;display:flex;align-items:center;gap:12px;}
.section-title::before{content:'';width:24px;height:1px;background:var(--gold);}
.section-title.fug{color:var(--red);}
.section-title.fug::before{background:var(--red);}
.resume-banner{margin-bottom:24px;padding:18px 22px;border:1px solid var(--amber);background:rgba(255,191,0,.07);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
.resume-banner .txt{font-size:14px;color:var(--ivory);}
.resume-banner .txt b{color:var(--amber);}
.cases-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;}
.case-card{background:rgba(10,13,18,.8);border:1px solid rgba(197,160,89,.35);padding:22px;cursor:pointer;transition:all .3s;}
.case-card:hover{border-color:var(--gold);transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.6);}
.case-card.done{border-color:rgba(74,222,128,.4);}
.case-card.fugitive{border-color:var(--red);box-shadow:0 0 24px rgba(239,68,68,.2);}
.case-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.case-icon{width:56px;height:56px;border:1px solid var(--gold);background:rgba(197,160,89,.08);display:flex;align-items:center;justify-content:center;font-size:26px;}
.case-status{font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.2em;padding:4px 10px;}
.case-status.open{background:rgba(74,222,128,.15);color:var(--green);}
.case-status.done{background:rgba(74,222,128,.25);color:var(--green);}
.case-status.extreme{background:rgba(239,68,68,.15);color:var(--red);}
.case-status.fug{background:var(--red);color:#fff;}
.case-name{font-family:'Libre Caslon Text',serif;font-size:20px;font-weight:700;color:var(--goldl);margin-bottom:2px;}
.case-artifact{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--amber);letter-spacing:.08em;margin-bottom:10px;}
.case-brief{font-size:12px;color:var(--onv);line-height:1.6;margin-bottom:14px;}
.case-meta{display:flex;gap:14px;flex-wrap:wrap;padding-top:12px;border-top:1px solid rgba(197,160,89,.2);}
.case-meta span{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--onv);letter-spacing:.1em;text-transform:uppercase;}
.case-meta i{color:var(--gold);margin-right:5px;}
.case-dyn{margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--level-up);letter-spacing:.12em;text-transform:uppercase;}
.case-dyn.fug{color:var(--red);}
.hq-footer{padding:14px 32px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.hq-btn{padding:12px 22px;border:1px solid var(--gold);background:rgba(0,51,68,.4);color:var(--goldl);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:10px;transition:all .3s;text-decoration:none;}
.hq-btn:hover{background:var(--gold);color:var(--surface);}
.hq-btn.primary{background:var(--gold);color:var(--surface);font-weight:700;}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .3s;}
.modal-backdrop.active{opacity:1;pointer-events:auto;}
.brief-modal{max-width:620px;width:100%;background:var(--ivory);color:#1a1a1a;padding:32px;border:1px solid var(--gold);position:relative;max-height:85vh;overflow-y:auto;}
.brief-close{position:absolute;top:12px;right:12px;width:32px;height:32px;background:transparent;border:1px solid var(--bronze);color:var(--bronze);cursor:pointer;border-radius:2px;font-size:16px;}
.brief-kicker{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--bronze);letter-spacing:.3em;text-transform:uppercase;text-align:center;margin-bottom:10px;}
.brief-name{font-family:'Libre Caslon Text',serif;font-size:26px;font-weight:700;text-align:center;margin-bottom:4px;}
.brief-artifact{font-family:'JetBrains Mono',monospace;font-size:11px;color:#8a6a2f;text-align:center;margin-bottom:20px;}
.brief-text{font-family:'Libre Caslon Text',serif;font-style:italic;font-size:15px;line-height:1.7;background:rgba(197,160,89,.1);border-left:3px solid var(--gold);padding:16px 18px;margin-bottom:20px;}
.brief-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:24px;}
.brief-cell{background:rgba(0,51,68,.08);border-left:2px solid var(--bronze);padding:10px 12px;font-family:'JetBrains Mono',monospace;font-size:10px;}
.brief-cell .l{color:#888;text-transform:uppercase;letter-spacing:.1em;font-size:8px;margin-bottom:3px;}
.brief-cell .v{font-weight:700;}
.brief-actions{display:flex;gap:12px;justify-content:flex-end;}
</style>
</head>
<body>
<div class="hq-bg"></div><div class="grid-overlay"></div><div class="film-grain"></div><div class="scanlines"></div><div class="vignette"></div>
<div class="ui">
  <div class="hq-header">
    <div class="hq-brand"><div class="hq-logo">M:I</div><div><div class="hq-title">Central de Comando</div><div class="hq-sub">Operação Nexus — Divisão de Recuperação</div></div></div>
    <div class="agent-chip"><i class="fas fa-user-secret"></i> Agente <b id="agentName">—</b> <span class="lvl"><i class="fas fa-star"></i> Nível <b id="agentLevel">1</b></span></div>
  </div>
  <div class="hq-main">
    <div id="resumeSlot"></div>
    <div id="fugSlot"></div>
    <div class="section-title">Casos Disponíveis</div>
    <div class="cases-grid" id="casesGrid"></div>
  </div>
  <div class="hq-footer">
    <a href="07-museu.html" class="hq-btn"><i class="fas fa-trophy"></i> Sala de Troféus</a>
    <a href="01-login.html" class="hq-btn"><i class="fas fa-right-from-bracket"></i> Trocar Agente</a>
  </div>
</div>
<div class="modal-backdrop" id="briefModal">
  <div class="brief-modal">
    <button class="brief-close" id="briefClose">✕</button>
    <div class="brief-kicker">/// Dossiê Confidencial ///</div>
    <div class="brief-name" id="briefName">—</div>
    <div class="brief-artifact" id="briefArtifact">—</div>
    <div class="brief-text" id="briefText">—</div>
    <div class="brief-grid" id="briefGrid"></div>
    <div class="brief-actions">
      <button class="hq-btn" id="briefCancel">Recusar</button>
      <button class="hq-btn primary" id="briefAccept"><i class="fas fa-folder-open"></i> Aceitar Caso</button>
    </div>
  </div>
</div>
<script src="../database.js"></script>
<script src="../data/artifacts.js"></script>
<script src="../nexus-generator.js"></script>
<script src="../audio-system.js" defer></script>
<script>
(function(){
'use strict';
var AGENT_KEY='minexus_agent', CASE_KEY='minexus_case_001', COLLECTION_KEY='minexus_museum_collection', LEVEL_KEY='minexus_agent_level';
var Career={
  PRISON:'minexus_prison',FUG:'minexus_fugitives',RES:'minexus_resolved',
  get:function(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},
  resolved:function(){return this.get(this.RES,0);},
  getPrison:function(){return this.get(this.PRISON,[]);},
  getFugitives:function(){return this.get(this.FUG,[]);},
  dueFugitives:function(){var r=this.resolved();return this.getFugitives().filter(function(x){return x.reopenAt<=r;});},
  removeFugitive:function(at){this.set(this.FUG,this.getFugitives().filter(function(x){return x.at!==at;}));}
};
window.NexusCareer=Career;
var agent=null,caseData=null,collection=[];
try{agent=JSON.parse(localStorage.getItem(AGENT_KEY)||'null');}catch(e){}
try{caseData=JSON.parse(localStorage.getItem(CASE_KEY)||'null');}catch(e){}
try{collection=JSON.parse(localStorage.getItem(COLLECTION_KEY)||'[]');}catch(e){collection=[];}
if(!agent){window.location.href='01-login.html';return;}
document.getElementById('agentName').textContent=agent.codename||'—';
var level=parseInt(localStorage.getItem(LEVEL_KEY)||'1',10);
document.getElementById('agentLevel').textContent=level;
var DB=window.NEXUS_DATABASE;
if(!DB||!DB.cases){alert('database.js não carregado.');return;}
var cases=Object.values(DB.cases);
var TZMAP={Cusco:'UTC-5',Lima:'UTC-5','Tóquio':'UTC+9',Kyoto:'UTC+9',Paris:'UTC+1','Rio de Janeiro':'UTC-3',Cairo:'UTC+2',Luxor:'UTC+2',Londres:'UTC+0',Atenas:'UTC+2',Viena:'UTC+1',Praga:'UTC+1',Berlim:'UTC+1',Moscou:'UTC+3','Buenos Aires':'UTC-3',Havana:'UTC-5','Nova York':'UTC-5'};
function cityTZ(n){return (DB.cities&&DB.cities[n]&&DB.cities[n].tz)||TZMAP[n]||'UTC-5';}
function getLevelBonus(l){var h=0;if(l>=5)h=8;else if(l>=4)h=6;else if(l>=3)h=4;else if(l>=2)h=2;return h;}
function audio(ev){try{if(window.ArchiveAudio&&typeof window.ArchiveAudio[ev]==='function')window.ArchiveAudio[ev]();}catch(e){}}
function buildRuntimeCities(c){
  if(c.cityOrder&&DB.cities){return c.cityOrder.map(function(n,i){var cat=DB.cities[n]||{};return{name:n,country:cat.country||'',photo:cat.photo||null,visited:i===0,current:i===0,revealed:true};});}
  return (c.cities||[]).map(function(city,i){return{name:city.name,country:city.country,photo:city.photo||null,visited:i===0,current:i===0,revealed:true};});
}
if(caseData){
  document.getElementById('resumeSlot').innerHTML='<div class="resume-banner"><div class="txt">Operação em andamento: <b>'+caseData.codename+'</b> — '+caseData.artifact+'</div><button class="hq-btn primary" id="btnResume"><i class="fas fa-play"></i> Retomar Operação</button></div>';
  document.getElementById('btnResume').addEventListener('click',function(){audio('playClick');window.location.href='03-globo.html';});
}
// 🚨 Foragidos com reabertura devida
var due=Career.dueFugitives();
if(due.length){
  var fs=document.getElementById('fugSlot');
  fs.innerHTML='<div class="section-title fug"><i class="fas fa-bolt"></i> Foragidos — Novos Indícios</div><div class="cases-grid" id="fugGrid"></div>';
  var fg=document.getElementById('fugGrid');
  due.forEach(function(f){
    var card=document.createElement('div');card.className='case-card fugitive';
    card.innerHTML='<div class="case-top"><div class="case-icon">'+(f.artifactIcon||'🏺')+'</div><div class="case-status fug">FORAGIDO</div></div><div class="case-name">'+(f.codename||'Caso Reaberto')+'</div><div class="case-artifact">'+f.artifact+'</div><div class="case-brief">Novos indícios surgiram. O suspeito voltou a agir em outro local. Rastreie e capture.</div><div class="case-dyn fug"><i class="fas fa-crosshairs"></i> Recompensa: prisão definitiva</div>';
    card.addEventListener('click',function(){openFugBrief(f);audio('playClick');});
    fg.appendChild(card);
  });
}
var grid=document.getElementById('casesGrid');
cases.forEach(function(c){
  var done=collection.some(function(x){return x.id===c.id;});
  var rt=buildRuntimeCities(c);var first=rt[0]||{name:'—',country:''};
  var card=document.createElement('div');card.className='case-card'+(done?' done':'');
  card.innerHTML='<div class="case-top"><div class="case-icon">'+(c.artifactIcon||'🏺')+'</div><div class="case-status '+(done?'done':(c.difficulty==='EXTREMA'?'extreme':'open'))+'">'+(done?'CONCLUÍDO':c.difficulty)+'</div></div><div class="case-name">'+c.codename+'</div><div class="case-artifact">'+c.artifact+'</div><div class="case-brief">'+c.brief+'</div><div class="case-meta"><span><i class="fas fa-map-marker-alt"></i> '+first.name+'</span><span><i class="fas fa-clock"></i> '+c.timeLimitHours+'h + bônus</span><span><i class="fas fa-city"></i> '+rt.length+' cidades</span></div><div class="case-dyn"><i class="fas fa-dice"></i> Roteiro dinâmico</div>';
  card.addEventListener('click',function(){openBrief(c);audio('playClick');});
  grid.appendChild(card);
});
var selectedCase=null,selectedFug=null;
function openBrief(c){
  selectedCase=c;selectedFug=null;
  var rt=buildRuntimeCities(c);var first=rt[0]||{name:'—',country:''};
  var bonus=getLevelBonus(level);var total=(c.timeLimitHours||48)+bonus;
  document.getElementById('briefName').textContent=c.codename;
  document.getElementById('briefArtifact').textContent=(c.artifactIcon||'')+' '+c.artifact;
  document.getElementById('briefText').textContent=c.brief;
  document.getElementById('briefGrid').innerHTML='<div class="brief-cell"><div class="l">Origem</div><div class="v">'+first.name+', '+first.country+'</div></div><div class="brief-cell"><div class="l">Prazo Base</div><div class="v">'+c.timeLimitHours+'h</div></div><div class="brief-cell"><div class="l">Bônus Nível '+level+'</div><div class="v" style="color:#1a7a3a;">+'+bonus+'h</div></div><div class="brief-cell"><div class="l">Prazo Total</div><div class="v" style="color:#8a6a2f;">'+total+'h</div></div><div class="brief-cell"><div class="l">Dificuldade</div><div class="v">'+c.difficulty+'</div></div><div class="brief-cell"><div class="l">Perfil</div><div class="v">'+c.initialProfile+'</div></div>';
  document.getElementById('briefModal').classList.add('active');
}
function openFugBrief(f){
  selectedFug=f;selectedCase=null;
  var bonus=getLevelBonus(level);var total=48+bonus;
  document.getElementById('briefName').textContent=f.codename||'Caso Reaberto';
  document.getElementById('briefArtifact').textContent=(f.artifactIcon||'')+' '+f.artifact;
  document.getElementById('briefText').textContent='FORAGIDO: novos indícios apontam que o suspeito voltou a agir. Local diferente, mesmo ladrão. Capture-o definitivamente.';
  document.getElementById('briefGrid').innerHTML='<div class="brief-cell"><div class="l">Tipo</div><div class="v" style="color:#c00;">REABERTO</div></div><div class="brief-cell"><div class="l">Prazo Total</div><div class="v" style="color:#8a6a2f;">'+total+'h</div></div><div class="brief-cell"><div class="l">Alvo</div><div class="v">'+(f.culpritId||'—')+'</div></div>';
  document.getElementById('briefModal').classList.add('active');
}
function closeBrief(){document.getElementById('briefModal').classList.remove('active');selectedCase=null;selectedFug=null;}
document.getElementById('briefClose').addEventListener('click',closeBrief);
document.getElementById('briefCancel').addEventListener('click',closeBrief);
document.getElementById('briefModal').addEventListener('click',function(e){if(e.target.id==='briefModal')closeBrief();});
document.getElementById('briefAccept').addEventListener('click',function(){
  if(!selectedCase&&!selectedFug)return;
  if(caseData&&!confirm('Abandonar a operação "'+caseData.codename+'" e aceitar a nova?'))return;
  var bonus=getLevelBonus(level);var newCase=null;
  if(selectedFug){
    var art=(window.NEXUS_ARTIFACTS||[]).filter(function(a){return (a.name||'').trim()===(selectedFug.artifact||'').trim();})[0]||null;
    newCase=window.NexusGenerator.generateCase({artifact:art,culpritId:selectedFug.culpritId,level:level});
    newCase.timeLimitHours=(newCase.timeLimitHours||48)+bonus;
    Career.removeFugitive(selectedFug.at);
  } else {
    var art2=(window.NEXUS_ARTIFACTS||[]).filter(function(a){return (a.name||'').trim()===(selectedCase.artifact||'').trim();})[0]||null;
    newCase=window.NexusGenerator.generateCase({artifact:art2,level:level});
    newCase.timeLimitHours=(newCase.timeLimitHours||48)+bonus;
  }
  newCase.clues={geo:[],id:[],neg:[]};newCase.locationsVisited=[];newCase.burnedLocations=[];
  newCase.timeState={timeLimitHours:newCase.timeLimitHours,currentHour:9,currentDay:1,currentCityTZ:cityTZ(newCase.cities&&newCase.cities[0]?newCase.cities[0].name:'')};
  try{localStorage.setItem(CASE_KEY,JSON.stringify(newCase));}catch(e){}
  audio('playMissionAccept');window.location.href='03-globo.html';
});
console.log('[HQ] v6.0 — foragidos + bônus | Nível:',level,'| Presos:',Career.getPrison().length,'| Foragidos devidos:',due.length);
})();
</script>
</body>
</html>
