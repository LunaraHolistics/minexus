<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuga Regional — PROJETO M:I</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--surface:#0a0d12;--on:#e5e2e1;--onv:#c1c7cc;--gold:#C5A059;--goldl:#e9c176;--bronze:#CD7F32;--amber:#FFBF00;--petrol:#003344;--red:#ef4444;--green:#4ade80;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--surface);font-family:'Manrope',sans-serif;color:var(--on);}
.road-bg{position:fixed;inset:0;z-index:1;background:radial-gradient(ellipse at 50% 100%,rgba(239,68,68,.15) 0%,transparent 55%),linear-gradient(180deg,#05070a 0%,#0a0d12 40%,#12100e 100%);}
.rain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.35;background:repeating-linear-gradient(75deg,transparent 0,transparent 3px,rgba(180,200,220,.12) 3px,rgba(180,200,220,.12) 4px);animation:rain-fall .5s linear infinite;}
@keyframes rain-fall{from{background-position:0 0;}to{background-position:-40px 80px;}}
.road-lines{position:fixed;bottom:0;left:0;right:0;height:30%;z-index:2;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0,transparent 60px,rgba(255,191,0,.25) 60px,rgba(255,191,0,.25) 100px);animation:road-move 1s linear infinite;}
@keyframes road-move{from{background-position:0 0;}to{background-position:-100px 0;}}
.film-grain{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:.08;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");mix-blend-mode:overlay;}
.scanlines{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:.15;background:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0,rgba(0,0,0,.3) 1px,transparent 1px,transparent 3px);}
.vignette{position:fixed;inset:0;z-index:6;pointer-events:none;box-shadow:inset 0 0 200px rgba(0,0,0,.9);}
.ui{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
.panel{max-width:760px;width:100%;background:rgba(10,13,18,.9);backdrop-filter:blur(16px);border:1px solid var(--red);padding:32px;box-shadow:0 30px 80px rgba(0,0,0,.8),0 0 40px rgba(239,68,68,.2);}
.kicker{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--red);letter-spacing:.3em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
.heading{font-family:'Libre Caslon Text',serif;font-size:30px;font-weight:700;color:var(--goldl);margin-bottom:12px;}
.narrative{font-family:'Libre Caslon Text',serif;font-style:italic;font-size:15px;color:var(--onv);line-height:1.7;margin-bottom:20px;}
.hud{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
.hud-chip{padding:8px 16px;border:1px solid var(--gold);background:rgba(0,51,68,.3);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);}
.hud-chip.time{color:var(--amber);border-color:var(--amber);}
.hud-chip.time.low{color:var(--red);border-color:var(--red);animation:pulse-red 1s infinite;}
@keyframes pulse-red{0%,100%{opacity:1;}50%{opacity:.5;}}
.route-track{display:flex;align-items:center;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
.route-city{padding:10px 16px;border:1px solid rgba(197,160,89,.4);background:rgba(10,13,18,.6);font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--onv);}
.route-city.here{border-color:var(--amber);color:var(--amber);box-shadow:0 0 14px rgba(255,191,0,.3);}
.route-city.villain{border-color:var(--red);color:var(--red);box-shadow:0 0 14px rgba(239,68,68,.4);}
.route-arrow{color:var(--bronze);}
.options{display:flex;flex-direction:column;gap:12px;}
.opt{padding:16px 20px;background:rgba(10,13,18,.7);border:1px solid rgba(197,160,89,.3);cursor:pointer;transition:all .2s;display:flex;gap:14px;align-items:center;}
.opt:hover{border-color:var(--amber);background:rgba(255,191,0,.1);transform:translateX(4px);}
.opt .ic{font-size:22px;width:34px;text-align:center;}
.opt .lb{font-family:'Manrope',sans-serif;font-size:14px;font-weight:600;color:var(--on);}
.opt .sub{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--onv);margin-top:2px;}
.result-box{padding:20px;border:1px solid var(--gold);background:rgba(0,51,68,.3);margin-bottom:20px;text-align:center;}
.result-box.win{border-color:var(--green);background:rgba(74,222,128,.1);}
.result-box.lose{border-color:var(--red);background:rgba(239,68,68,.1);}
.result-title{font-family:'Libre Caslon Text',serif;font-size:24px;font-weight:700;margin-bottom:8px;}
.result-box.win .result-title{color:var(--green);}
.result-box.lose .result-title{color:var(--red);}
.btn{padding:14px 28px;background:var(--gold);color:var(--surface);border:none;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;gap:10px;}
.btn:hover{background:var(--amber);}
.btn.ghost{background:transparent;color:var(--goldl);border:1px solid var(--gold);}
</style>
</head>
<body>
<div class="road-bg"></div><div class="road-lines"></div><div class="rain"></div>
<div class="film-grain"></div><div class="scanlines"></div><div class="vignette"></div>
<div class="ui"><div class="panel" id="panel"></div></div>
<script src="../database.js"></script>
<script src="../audio-system.js" defer></script>
<script>
(function(){'use strict';
var CAPTURE_KEY='minexus_capture_result', CASE_KEY='minexus_case_001';
var captureData=null, caseData=null;
try{captureData=JSON.parse(localStorage.getItem(CAPTURE_KEY)||'null');}catch(e){}
try{caseData=JSON.parse(localStorage.getItem(CASE_KEY)||'null');}catch(e){}
if(!captureData){window.location.href='02-hq.html';return;}
var DB=window.NEXUS_DATABASE||{cities:{}};

var ESCAPE={
 "Rio de Janeiro":["Paraty","Santos"],"Paris":["Lyon","Marselha"],"Londres":["Dover","Calais"],
 "Tóquio":["Kyoto","Osaka"],"Cairo":["Alexandria","Port Said"],"Cusco":["Lima","Arequipa"],
 "Buenos Aires":["La Plata","Mar del Plata"],"Havana":["Varadero","Santiago de Cuba"],
 "Moscou":["Tver","São Petersburgo"],"Viena":["Bratislava","Praga"],"Berlim":["Leipzig","Dresden"],
 "Atenas":["Pireu","Salônica"],"Luxor":["Assuã","Cairo"],"Londres":["Brighton","Dover"],
 "Nova York":["Newark","Filadélfia"],"Pequim":["Tianjin","Qinhuangdao"],"Xangai":["Ningbo","Nantong"],
 "Mumbai":["Pune","Goa"],"Cidade do México":["Puebla","Veracruz"],"São Petersburgo":["Vyborg","Helsinque"],
 "Roma":["Nápoles","Civitavecchia"],"Praga":["Brno","Viena"],"Kyoto":["Osaka","Kobe"]
};

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var seed=(captureData.capturedAt||Date.now())>>>0;
var rnd=mulberry32(seed);
var rating=captureData.rating||'B';
var chance={S:0.3,A:0.55,B:0.85}[rating]; if(chance==null)chance=0.6;
var fuga=rnd()<chance;

var captureCity=(caseData&&caseData.culprit&&caseData.culprit.location)?caseData.culprit.location.city:(captureData.suspectName?'—':'—');
var chain=(caseData&&caseData.escapeChain&&caseData.escapeChain.length>=3)?caseData.escapeChain:(ESCAPE[captureCity]||[captureCity,captureCity,captureCity]);
if(chain[0]===chain[1])chain=[captureCity,(ESCAPE[captureCity]||[captureCity,'—'])[0]||'—',(ESCAPE[captureCity]||[captureCity,'—','—'])[1]||'—'];

var BOARD=[{n:'Porto',ic:'⚓'},{n:'Aeroporto',ic:'✈️'},{n:'Rodoviária',ic:'🚌'}];
var villainBoard=Math.floor(rnd()*3);
var intelCorrect=Math.floor(rnd()*3);
var T1=4, T2=5;
var hoursLeft=24;
var phase='start';
var narrowed=null;
var suspectName=captureData.suspectName||'O suspeito';

function audio(ev){try{if(window.ArchiveAudio&&typeof window.ArchiveAudio[ev]==='function')window.ArchiveAudio[ev]();}catch(e){}}
function P(){return document.getElementById('panel');}

function hud(){
  return '<div class="hud"><div class="hud-chip"><i class="fas fa-user-secret"></i> '+suspectName+'</div>'+
    '<div class="hud-chip time'+(hoursLeft<=6?' low':'')+'"><i class="fas fa-clock"></i> '+hoursLeft+'h / 24h</div>'+
    '<div class="hud-chip"><i class="fas fa-car"></i> Perseguição de carro</div></div>';
}
function routeTrack(hereIdx,villainIdx){
  var h='<div class="route-track">';
  for(var i=0;i<chain.length;i++){
    var cls='route-city'+(i===hereIdx?' here':'')+(i===villainIdx?' villain':'');
    h+='<div class="'+cls+'">'+chain[i]+'</div>';
    if(i<chain.length-1)h+='<span class="route-arrow">→</span>';
  }
  return h+'</div>';
}

function render(){
  var p=P();
  if(phase==='start'){
    if(!fuga){
      p.innerHTML='<div class="kicker"><i class="fas fa-lock"></i> Custódia</div>'+
        '<div class="heading">Sem fuga desta vez</div>'+
        '<div class="narrative">'+suspectName+' foi escoltado ao presídio de segurança máxima. Nenhuma tentativa de fuga detectada. O caso segue para o acervo.</div>'+
        '<button class="btn" id="go"><i class="fas fa-trophy"></i> Entregar ao Museu</button>';
      document.getElementById('go').onclick=function(){audio('playClick');window.location.href='07-museu.html';};
      return;
    }
    p.innerHTML='<div class="kicker"><i class="fas fa-bolt"></i> ALERTA VERMELHO</div>'+
      '<div class="heading">🚨 FUGA!</div>'+
      '<div class="narrative">'+suspectName+' '+(rnd()<0.5?'subornou um guarda e escapou pela lateral do presídio':'foi solto por uma brecha jurídica e desapareceu')+'. '+
      'Informantes o colocam em <b style="color:var(--red)">'+chain[1]+'</b>, tentando sair do país. Você tem <b>24 horas</b> e um carro. A caçada começa AGORA.</div>'+
      hud()+routeTrack(0,1)+
      '<div class="options"><div class="opt" id="drive1"><div class="ic">🚗</div><div><div class="lb">Dirigir até '+chain[1]+'</div><div class="sub">-'+T1+'h • estrada costeira</div></div></div></div>';
    document.getElementById('drive1').onclick=function(){audio('playWhoosh');hoursLeft-=T1;checkTime()||(phase='intel',render());};
    return;
  }
  if(phase==='intel'){
    p.innerHTML='<div class="kicker"><i class="fas fa-map-marker-alt"></i> '+chain[1]+'</div>'+
      '<div class="heading">O rastro em '+chain[1]+'</div>'+
      '<div class="narrative">Ele passou por aqui. Um informante sabe onde '+suspectName+' vai embarcar em '+chain[2]+' — mas informação custa tempo.</div>'+
      hud()+routeTrack(1,2)+
      '<div class="options">'+
      '<div class="opt" data-i="0"><div class="ic">🍸</div><div><div class="lb">Bartender do porto</div><div class="sub">-2h • pode saber tudo</div></div></div>'+
      '<div class="opt" data-i="1"><div class="ic">🚕</div><div><div class="lb">Taxista da rodoviária</div><div class="sub">-2h • viu algo</div></div></div>'+
      '<div class="opt" data-i="2"><div class="ic">🏨</div><div><div class="lb">Recepcionista do hotel</div><div class="sub">-2h • arriscado</div></div></div>'+
      '<div class="opt" id="skip"><div class="ic">⏭️</div><div><div class="lb">Sem tempo a perder — ir direto a '+chain[2]+'</div><div class="sub">-'+T2+'h</div></div></div>'+
      '</div>';
    var opts=p.querySelectorAll('.opt[data-i]');
    for(var k=0;k<opts.length;k++){opts[k].onclick=(function(el){return function(){
      var i=parseInt(el.getAttribute('data-i'),10);
      hoursLeft-=2; if(checkTime())return;
      if(i===intelCorrect){narrowed=[villainBoard];audio('playSuccess');}
      else if(i===(intelCorrect+1)%3){narrowed=[villainBoard,(villainBoard+1)%3];audio('playNotification');}
      else{audio('playError');}
      phase='leg2';render();
    };})(opts[k]);}
    document.getElementById('skip').onclick=function(){audio('playWhoosh');hoursLeft-=T2;checkTime()||(phase='final',render());};
    return;
  }
  if(phase==='leg2'){
    p.innerHTML='<div class="kicker"><i class="fas fa-road"></i> Estrada</div>'+
      '<div class="heading">Rumo a '+chain[2]+'</div>'+
      '<div class="narrative">'+(narrowed&&narrowed.length===1?('Intel confirma: ele vai tentar o <b>'+BOARD[narrowed[0]].n+'</b>.'):('Intel incompleta. Ele pode tentar '+(narrowed?BOARD[narrowed[0]].n+' ou '+BOARD[narrowed[1]].n:'qualquer ponto')+'.') )+'</div>'+
      hud()+routeTrack(2,2)+
      '<div class="options"><div class="opt" id="drive2"><div class="ic">🚗</div><div><div class="lb">Dirigir até '+chain[2]+'</div><div class="sub">-'+T2+'h</div></div></div></div>';
    document.getElementById('drive2').onclick=function(){audio('playWhoosh');hoursLeft-=T2;checkTime()||(phase='final',render());};
    return;
  }
  if(phase==='final'){
    var list=narrowed||[0,1,2];
    var h='<div class="kicker"><i class="fas fa-crosshairs"></i> '+chain[2]+'</div>'+
      '<div class="heading">O ponto de embarque</div>'+
      '<div class="narrative">O tempo aperta. Escolha onde montar o cerco final para impedir '+suspectName+' de sair do país.</div>'+
      hud()+routeTrack(2,2)+'<div class="options">';
    for(var i=0;i<list.length;i++){var b=BOARD[list[i]];
      h+='<div class="opt" data-b="'+list[i]+'"><div class="ic">'+b.ic+'</div><div><div class="lb">'+b.n+'</div><div class="sub">Montar cerco</div></div></div>';}
    h+='</div>';
    p.innerHTML=h;
    var bs=p.querySelectorAll('.opt[data-b]');
    for(var j=0;j<bs.length;j++){bs[j].onclick=(function(el){return function(){
      var pick=parseInt(el.getAttribute('data-b'),10);
      if(pick===villainBoard){phase='win';}else{phase='lose';}
      render();
    };})(bs[j]);}
    return;
  }
  if(phase==='win'){
    audio('playMissionComplete');
    p.innerHTML='<div class="result-box win"><div class="result-title">✅ RECAPTURADO!</div>'+
      'Você intercepta '+suspectName+' no '+BOARD[villainBoard].n+' de '+chain[2]+' com '+hoursLeft+'h de sobra. Desta vez, sem brechas.</div>'+
      '<button class="btn" id="go"><i class="fas fa-trophy"></i> Entregar ao Museu</button>';
    document.getElementById('go').onclick=function(){window.location.href='07-museu.html';};
    return;
  }
  // lose
  p.innerHTML='<div class="result-box lose"><div class="result-title">🌫️ ELE ESCAPOU…</div>'+
    suspectName+' embarcou no '+BOARD[villainBoard].n+' enquanto você cercava o ponto errado. O artefato já está no museu — mas o fantasma segue livre. <b>Isto não acabou.</b></div>'+
    '<button class="btn ghost" id="go"><i class="fas fa-trophy"></i> Entregar ao Museu</button>';
  document.getElementById('go').onclick=function(){window.location.href='07-museu.html';};
}

function checkTime(){
  if(hoursLeft<=0){hoursLeft=0;phase='lose';render();return true;}
  return false;
}

render();
console.log('[FUGA] v1.0 — fuga:',fuga,'| rating:',rating,'| cadeia:',chain.join('>'));
})();
</script>
</body>
</html>
